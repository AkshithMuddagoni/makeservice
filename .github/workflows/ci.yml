name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (same install path as Render)
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase upload cleanup Edge Function
        run: deno check --config supabase/functions/fieldly-upload-cleanup/deno.json supabase/functions/fieldly-upload-cleanup/index.ts

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser end-to-end smoke tests
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build
