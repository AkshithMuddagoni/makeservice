name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (same install path as Render)
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
