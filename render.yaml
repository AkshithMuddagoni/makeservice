services:
  - type: web
    name: fieldly-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

      # Required by the production database adapter. Render prompts for this
      # value during initial Blueprint creation; existing services must set it
      # manually in Dashboard > Environment before deploying this backend.
      - key: DATABASE_URL
        sync: false

      # Generate the server-side session secret in Render. Never commit it.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://makeservice.onrender.com

      # Keep these off until the MSG91/DLT and secure KYC/scanner gates pass.
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: VITE_PHONE_OTP_ENABLED
        value: "false"
      - key: PROVIDER_DOCUMENT_UPLOADS_ENABLED
        value: "false"
